network:
  8080/tcp: "Proxy ingress - ne pas mapper directement, utilisez le port 8088 pour l'acces externe."
  7007/tcp: "Agent Dozzle - a mapper uniquement si 'Agent integre' est active."
  8088/tcp: "Acces direct - a mapper quand l'option 'Acces direct' est activee."

configuration:
  log_level:
    name: Niveau de journalisation
    description: Verbosite des logs du processus Dozzle cote add-on.
  filter:
    name: Filtre Docker
    description: Filtre Docker optionnel (syntaxe identique a docker ps --filter).
  no_analytics:
    name: Desactiver les statistiques anonymes
    description: N'envoie pas de donnees d'usage a Dozzle.
  enable_actions:
    name: Actions sur les conteneurs
    description: Autorise redemarrage / arret depuis l'interface (a utiliser avec prudence).
  enable_master:
    name: "Activer l'interface web"
    description: >
      Active l'interface web Dozzle (Ingress + acces direct).
      Mettre a false avec 'Agent integre' active pour le mode agent seul
      (pas d'UI, pas de nginx - equivalent a l'addon dozzle-agent standalone).
  enable_agent:
    name: "Agent integre - exposer cet hote HA aux instances Dozzle distantes"
    description: >
      Lance un agent Dozzle sur le port 7007 (fixe).
      Utilisez cette option quand une autre instance Dozzle sur une AUTRE machine
      doit voir les conteneurs de cet hote HA. Mappez le port 7007 dans l'onglet
      Reseau pour l'acces externe.
      Pas necessaire pour voir les conteneurs HA ici - le socket Docker s'en charge.
  agent_hostname:
    name: "Nom affiche de l'agent"
    description: >
      Libelle affiche pour cet hote dans les interfaces Dozzle distantes
      (ex. "homeassistant"). Laisser vide pour utiliser le nom d'hote par defaut.
  agent_cert:
    name: "Certificat TLS personnalise"
    description: >
      Nom du fichier certificat TLS dans /ssl/ (ex. dozzle_cert.pem).
      Quand defini avec agent_key, seules les instances Dozzle partageant la meme
      paire de cles peuvent se connecter a l'agent ou aux agents distants.
      L'agent et le master doivent utiliser le meme certificat.
  agent_key:
    name: "Cle TLS personnalisee"
    description: >
      Nom du fichier cle privee TLS dans /ssl/ (ex. dozzle_key.pem).
      Doit correspondre au certificat.
  remote_agents:
    name: "Agents distants - ajouter d'autres hotes Docker"
    description: >
      Liste host:port separee par des virgules pointant vers des agents Dozzle
      sur d'AUTRES machines (ex. 192.168.1.10:7007,192.168.1.20:7007).
      Ces conteneurs apparaitront aux cotes des conteneurs HA dans cet add-on.
  enable_direct_access:
    name: Acces direct (port 8088)
    description: >
      Expose Dozzle sur le port 8088 sans le prefixe token Ingress, accessible
      via http://ip-ha:8088/. Mappez le port 8088 dans l'onglet Reseau.
      Ingress continue de fonctionner normalement en parallele.
